<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('我的订单')"></head>
<body>
<div class="layout">
    <aside th:replace="fragments :: patient-sidebar('registrations')"></aside>
    <div class="main">
        <header th:replace="fragments :: topbar('我的订单', ${user})"></header>
        <div class="content">
            <div class="card">
                <div class="card-head"><h2>📋 我的订单</h2>
                    <div class="hint">预约后请及时支付，就诊前可取消（已支付自动退款）</div></div>
                <div class="table-wrap">
                    <table>
                        <thead>
                        <tr><th>单号</th><th>类型</th><th>科室</th><th>医生</th><th>就诊时间</th><th>挂号费</th><th>状态</th><th>操作</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="r : ${myRegs}">
                            <td th:text="${r.regNo}" style="font-size:12px"></td>
                            <td th:text="${T(com.hospital.util.SlotText).regType(r.regType)}"></td>
                            <td th:text="${r.deptName}"></td>
                            <td th:text="${r.doctorName} + ' · ' + ${r.title}"></td>
                            <td th:text="${r.workDate} + ' ' + ${T(com.hospital.util.SlotText).slot(r.timeSlot)}"></td>
                            <td><b th:text="'¥' + ${r.fee}"></b></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${r.status=='BOOKED'} ? 'warning' : (${r.status=='PAID'} ? 'success' : (${r.status=='VISITED'} ? 'info' : 'muted'))"
                                      th:text="${T(com.hospital.util.SlotText).regStatus(r.status)}"></span>
                            </td>
                            <td>
                                <form method="post" th:action="@{/patient/pay/{id}(id=${r.id})}"
                                      style="display:inline" th:if="${r.status=='BOOKED'}">
                                    <button class="btn sm" type="submit">支付 ¥<span th:text="${r.fee}"></span></button>
                                </form>
                                <form method="post" th:action="@{/patient/cancel/{id}(id=${r.id})}"
                                      style="display:inline" th:if="${r.status=='BOOKED' or r.status=='PAID'}">
                                    <button class="btn danger sm" type="submit"
                                            th:onclick="return confirm('确认取消该预约？已支付将自动退款')">取消</button>
                                </form>
                                <span th:if="${r.status=='VISITED'}" style="font-size:12px;color:var(--text-muted)">已完成</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(myRegs)}"><td colspan="8" style="color:var(--text-muted)">暂无挂号记录，<a th:href="@{/patient/doctors}" style="color:var(--primary)">去挂号</a></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
