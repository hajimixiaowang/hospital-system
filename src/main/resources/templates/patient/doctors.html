<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('医生科室查看')"></head>
<body>
<div class="layout">
    <aside th:replace="fragments :: patient-sidebar('doctors')"></aside>
    <div class="main">
        <header th:replace="fragments :: topbar('医生科室查看', ${user})"></header>
        <div class="content">

            <div class="card">
                <div class="card-head">
                    <h2>👨‍⚕️ 科室与医生</h2>
                    <div class="hint">点击医生查看排班并挂号</div>
                </div>
                <div class="doctor-grid">
                    <div class="doctor-card" th:each="d : ${doctors}">
                        <div class="head">
                            <div class="avatar" th:text="${d.doctorName.substring(0,1)}">医</div>
                            <div>
                                <div class="name" th:text="${d.doctorName}"></div>
                                <div class="title" th:text="${d.deptName} + ' · ' + ${d.title}"></div>
                            </div>
                        </div>
                        <div class="tags">
                            <span class="tag" th:text="${d.goodAt}"></span>
                        </div>
                        <div class="foot">
                            <div>
                                <span class="stars">★</span>
                                <span class="score" th:text="${#numbers.formatDecimal(d.avgRating,1,1)}">5.0</span>
                                <span style="font-size:12px;color:var(--text-muted)" th:text="'（' + ${d.reviewCount} + ' 条评价）'"></span>
                            </div>
                            <a class="btn sm" th:href="@{/patient/doctor/{id}(id=${d.id})}">查看排班</a>
                        </div>
                    </div>
                </div>
                <div th:if="${#lists.isEmpty(doctors)}" style="color:var(--text-muted)">暂无医生</div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
