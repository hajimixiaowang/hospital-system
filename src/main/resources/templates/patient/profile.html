<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('个人中心')"></head>
<body>
<div class="layout">
    <aside th:replace="fragments :: patient-sidebar('profile')"></aside>
    <div class="main">
        <header th:replace="fragments :: topbar('个人中心', ${user})"></header>
        <div class="content">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">

                <div class="card" style="margin-bottom:0">
                    <div class="card-head"><h2>👤 个人资料</h2></div>
                    <form method="post" th:action="@{/patient/profile}">
                        <div class="form-row">
                            <label>真实姓名</label>
                            <input type="text" name="realName" th:value="${user.realName}" required>
                        </div>
                        <div class="form-row">
                            <label>手机号</label>
                            <input type="tel" name="phone" th:value="${user.phone}">
                        </div>
                        <div class="form-row">
                            <label>患者类型（影响挂号费结算）</label>
                            <select name="patientType">
                                <option value="NORMAL" th:selected="${user.patientType=='NORMAL'}">普通患者（全额）</option>
                                <option value="INSURANCE" th:selected="${user.patientType=='INSURANCE'}">医保患者（8 折）</option>
                                <option value="STUDENT" th:selected="${user.patientType=='STUDENT'}">学生患者（5 折）</option>
                            </select>
                        </div>
                        <button class="btn" type="submit">保存资料</button>
                    </form>
                </div>

                <div class="card" style="margin-bottom:0">
                    <div class="card-head"><h2>🔒 修改密码</h2></div>
                    <form method="post" th:action="@{/patient/password}">
                        <div class="form-row">
                            <label>原密码</label>
                            <input type="password" name="oldPwd" required>
                        </div>
                        <div class="form-row">
                            <label>新密码（至少 6 位）</label>
                            <input type="password" name="newPwd" required>
                        </div>
                        <button class="btn" type="submit">修改密码</button>
                        <div style="font-size:12px;color:var(--text-muted);margin-top:10px">修改成功后需重新登录</div>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>
</body>
</html>
