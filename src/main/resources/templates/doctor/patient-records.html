<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('患者就诊记录')"></head>
<body>
<div class="layout">
    <aside th:replace="fragments :: doctor-sidebar('home')"></aside>
    <div class="main">
        <header th:replace="fragments :: topbar('患者历史就诊', ${user})"></header>
        <div class="content">
            <div class="card">
                <div class="card-head"><h2>💊 历史就诊记录</h2>
                    <a class="btn sm ghost" th:href="@{/doctor}">← 返回工作台</a></div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>单号</th><th>科室</th><th>医生</th><th>就诊时间</th><th>诊断</th><th>处方</th></tr></thead>
                        <tbody>
                        <tr th:each="v : ${records}">
                            <td th:text="${v.regNo}" style="font-size:12px"></td>
                            <td th:text="${v.deptName}"></td>
                            <td th:text="${v.doctorName}"></td>
                            <td th:text="${v.workDate} + ' ' + ${T(com.hospital.util.SlotText).slot(v.timeSlot)}"></td>
                            <td th:text="${v.diagnosis} ?: '—'"></td>
                            <td th:text="${v.prescription} ?: '—'"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(records)}"><td colspan="6" style="color:var(--text-muted)">该患者暂无就诊记录</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
