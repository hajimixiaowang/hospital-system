<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('排班管理')"></head>
<body>
<div class="layout">
    <aside th:replace="fragments :: admin-sidebar('schedules')"></aside>
    <div class="main">
        <header th:replace="fragments :: topbar('号源管理', ${user})"></header>
        <div class="content">

            <div class="msg" th:if="${msg}" th:text="${msg}"></div>

            <div class="card">
                <div class="card-head"><h2>🗓️ 批量放号（建造者模式）</h2></div>
                <form method="post" th:action="@{/admin/plan}" class="form-grid" style="align-items:end">
                    <div class="form-row" style="margin:0"><label>医生</label>
                        <select name="doctorId" required>
                            <option value="">-- 选择医生 --</option>
                            <option th:each="d : ${doctors}" th:value="${d.id}"
                                    th:text="${d.deptName} + ' · ' + ${d.doctorName} + '（' + ${d.title} + '）'"></option>
                        </select></div>
                    <div class="form-row" style="margin:0"><label>开始日期</label>
                        <input type="date" name="startDate" required></div>
                    <div class="form-row" style="margin:0"><label>结束日期</label>
                        <input type="date" name="endDate" required></div>
                    <div class="form-row" style="margin:0"><label>每时段号数</label>
                        <input type="number" name="countPerSlot" value="20" min="1" max="200"></div>
                    <div class="form-row" style="margin:0;grid-column:1/-1">
                        <label>放号时段</label>
                        <div style="display:flex;gap:16px;align-items:center">
                            <label style="display:flex;align-items:center;gap:4px;margin:0"><input type="checkbox" name="slots" value="MORNING"> 上午</label>
                            <label style="display:flex;align-items:center;gap:4px;margin:0"><input type="checkbox" name="slots" value="AFTERNOON"> 下午</label>
                            <label style="display:flex;align-items:center;gap:4px;margin:0"><input type="checkbox" name="slots" value="NIGHT"> 夜间（上浮20%）</label>
                            <label style="display:flex;align-items:center;gap:4px;margin:0"><input type="checkbox" name="skipWeekend" value="true"> 跳过周末</label>
                            <button class="btn" type="submit">批量放号</button>
                        </div>
                    </div>
                </form>
                <div style="font-size:12px;color:var(--text-muted);margin-top:10px">
                    后端用 <b>SchedulePlan.Builder</b> 链式组装计划并统一校验，号源编号由<b>单例 NumberSourceGenerator</b> 全局唯一生成。
                </div>
            </div>

            <div class="card">
                <div class="card-head"><h2>📋 号源列表</h2></div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>号源编号</th><th>医生ID</th><th>日期</th><th>时段</th><th>号数</th><th>剩余</th><th>状态</th><th>操作</th></tr></thead>
                        <tbody>
                        <tr th:each="s : ${schedules}">
                            <td th:text="${s.sourceNo}" style="font-size:12px"></td>
                            <td th:text="${s.doctorId}"></td>
                            <td th:text="${s.workDate}"></td>
                            <td th:text="${T(com.hospital.util.SlotText).slot(s.timeSlot)}"></td>
                            <td th:text="${s.totalCount}"></td>
                            <td th:text="${s.remainCount}"></td>
                            <td><span class="badge" th:classappend="${s.status=='OPEN'} ? 'success' : 'muted'"
                                    th:text="${s.status=='OPEN'} ? '开放' : '关闭'"></span></td>
                            <td>
                                <form method="post" th:action="@{/admin/schedule/del/{id}(id=${s.id})}">
                                    <button class="btn danger sm" type="submit"
                                            th:onclick="return confirm('确认删除该号源？')">删除</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(schedules)}"><td colspan="8" style="color:var(--text-muted)">暂无号源</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
