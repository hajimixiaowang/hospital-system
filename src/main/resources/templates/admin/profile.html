<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('管理员个人中心')"></head>
<body>
<div class="layout">
    <aside th:replace="fragments :: admin-sidebar('profile')"></aside>
    <div class="main">
        <header th:replace="fragments :: topbar('管理员个人中心', ${user})"></header>
        <div class="content">
            <div class="card" style="max-width:520px">
                <div class="card-head"><h2>👤 管理员账号</h2></div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px;margin-bottom:20px">
                    <div><span style="color:var(--text-muted)">登录名：</span><span th:text="${user.username}"></span></div>
                    <div><span style="color:var(--text-muted)">姓名：</span><span th:text="${user.realName}"></span></div>
                    <div><span style="color:var(--text-muted)">角色：</span>系统管理员</div>
                    <div><span style="color:var(--text-muted)">客服电话：</span><span th:text="${servicePhone}"></span></div>
                </div>
                <h2 style="font-size:15px;margin-bottom:12px">🔒 修改密码</h2>
                <form method="post" th:action="@{/admin/password}">
                    <div class="form-row"><label>原密码</label>
                        <input type="password" name="oldPwd" required></div>
                    <div class="form-row"><label>新密码（至少 6 位）</label>
                        <input type="password" name="newPwd" required></div>
                    <button class="btn" type="submit">修改密码</button>
                    <div style="font-size:12px;color:var(--text-muted);margin-top:10px">修改成功后需重新登录</div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
