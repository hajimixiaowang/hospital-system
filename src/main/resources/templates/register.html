<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 · 医诊通</title>
    <link rel="stylesheet" th:href="@{/css/style.css?v=20261123b}">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="logo">🏥</div>
        <h1>患者注册</h1>
        <div class="sub">创建账号，享受在线预约挂号</div>

        <form method="post" th:action="@{/register}">
            <div class="form-row">
                <label>登录用户名</label>
                <input type="text" name="username" placeholder="设置登录名" required>
            </div>
            <div class="form-row">
                <label>密码</label>
                <input type="password" name="password" placeholder="至少 6 位" required>
            </div>
            <div class="form-row">
                <label>真实姓名</label>
                <input type="text" name="realName" placeholder="用于挂号与就诊" required>
            </div>
            <div class="form-row">
                <label>手机号</label>
                <input type="tel" name="phone" placeholder="选填">
            </div>
            <div class="form-row">
                <label>患者类型（影响挂号费结算）</label>
                <select name="patientType">
                    <option value="NORMAL">普通患者（全额）</option>
                    <option value="INSURANCE">医保患者（8 折）</option>
                    <option value="STUDENT">学生患者（5 折）</option>
                </select>
            </div>
            <button class="btn block" type="submit">注 册</button>
        </form>
        <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-muted)">
            <a th:href="@{/login}" style="color:var(--primary)">返回登录</a>
        </div>
    </div>
</div>
</body>
</html>
